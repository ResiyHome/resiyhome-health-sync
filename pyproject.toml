[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resiyhome-health-sync"
version = "1.0.0"
description = "Read-only Google Health integration for Home Assistant"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
test = [
    "homeassistant==2026.7.2",
    "Pillow==12.2.0",
    "pytest-homeassistant-custom-component==0.13.346",
    "ruff==0.15.21",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["custom_components/resiyhome_health_sync"]
python_version = "3.14"
strict = true
