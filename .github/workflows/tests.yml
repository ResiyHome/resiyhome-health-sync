name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest tests -v
      - name: Run Ruff
        run: python -m ruff check custom_components/resiyhome_health_sync tests scripts
      - name: Compile Python sources
        run: python -m compileall -q custom_components/resiyhome_health_sync tests scripts
      - name: Verify public release
        run: python scripts/verify_public_release.py .
